# Add/rename/move anything here without touching code.
#
# A project may carry:
#   name        customer-facing name
#   codename    internal nickname (optional)
#   number      project number (optional)
#   summary     one-line description
#   links       list of { type, label, url }
#   tags        freeform tags for cross-cutting grouping/search

