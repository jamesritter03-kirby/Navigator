# S2L Navigator — application + brand configuration
# Everything here is data-driven. Edit this file to re-theme or re-label the app;
# no code changes required.

app:
  name: "S2L Navigator"
  tagline: "Central hub for S2Labs projects, teams, tools & architecture"
  icon: "Graphics/S2L-Logo.png"
  logo_horizontal: "Graphics/S2 Labs Horizontal.png"
  logo_stacked: "Graphics/S2 Labs Stacked.png"  # Dark-theme variants (generated by tools/make_dark_logos.py — lightened wordmark).
  logo_horizontal_dark: "Graphics/S2 Labs Horizontal Dark.png"
  logo_stacked_dark: "Graphics/S2 Labs Stacked Dark.png"
brand:
  # Approximate S2Labs brand colors — confirm exact hex with design and update here.
  blue: "#24409A"      # primary (S2 mark)
  green: "#6CBE6C"     # accent (// mark)
  gray: "#6E7B8B"      # neutral wordmark
  ink: "#1F2733"       # body text
  surface: "#F2F5FA"   # cards / secondary background

# Common Microsoft 365 tenant used to build deep links.
tenant_id: "346af222-a763-43e1-a759-22af355b9698"

# Link types get an icon + label so the UI can render them consistently.
link_types:
  teams:    { label: "Teams",     icon: "💬" }
  app:      { label: "App",       icon: "🧰" }
  portal:   { label: "Portal",    icon: "📊" }
  repo:     { label: "Repo",      icon: "📦" }
  docs:     { label: "Docs",      icon: "📄" }
  sharepoint: { label: "SharePoint", icon: "📁" }
  dashboard: { label: "Dashboard", icon: "📈" }
  other:    { label: "Link",      icon: "🔗" }
