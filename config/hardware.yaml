remote_io:
  - model: "Advantech ADAM"
    summary: "Remote I/O modules (typically Modbus TCP/RTU)."
  - model: "Axiomatic"
    summary: "Remote I/O devices (typically CAN / J1939)."

networking:
  - component: "MikroTik routers"
    kind: "Router"
    summary: "Used where needed for field/site routing; external LTE modems can connect to the WAN port."
  - component: "Internal LTE modems"
    kind: "Cellular (internal)"
    summary: "Built into the Advantech EPC and Seeed Studio computers for remote-site connectivity."
  - component: "External LTE modems"
    kind: "Cellular (external)"
    summary: "For edge devices without internal LTE; sometimes on the MikroTik WAN. Models: Digi IX20W, Sierra Wireless RV50X (1103052)."
  - component: "GPS + NTP time sync"
    kind: "Timing"
    summary: "GPS is a core part of the edge platform; drives NTP so all modules and devices are time-synchronized."
