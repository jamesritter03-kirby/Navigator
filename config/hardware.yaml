# S2L Navigator — hardware catalog (data-driven)

edge_runtime:
  summary: >
    Standardized Linux edge runtime image installed on every hardware model. The .NET 8+
    configuration-based application (Launcher + modules) runs on top and assumes this stack exists.
  stack:
    - "MQTT broker"
    - "Redis"
    - "Node-RED"
    - "ZeroTier"
    - "ThingsBoard Gateway"
    - ".NET 8+ app + modules"

